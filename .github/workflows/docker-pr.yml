# PR 自动构建 Docker 镜像，构建后不推送。

name: PR 构建 Docker 镜像

on:
  pull_request:

concurrency:
  group: docker-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 校验
    runs-on: ubuntu-latest
    # 测试导入的服务模块要求配置 DATABASE_URL；占位值只用于允许只读单元测试导入，不会连接数据库。
    env:
      DATABASE_URL: postgresql://veges-ci:veges-ci@127.0.0.1:5432/veges_ci
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 代码检查
        run: npm run lint
      - name: 运行测试
        run: npm test

  build-amd64:
    name: 构建 amd64 镜像（不推送）
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 构建 amd64 镜像（不推送）
        run: |
          docker build \
            -t "vege-basket:pr-${{ github.event.pull_request.number }}-${GITHUB_SHA:0:12}-amd64" \
            .

  build-arm64:
    name: 构建 arm64 镜像（不推送）
    needs: verify
    runs-on: ubuntu-24.04-arm
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 构建 arm64 镜像（不推送）
        run: |
          docker build \
            -t "vege-basket:pr-${{ github.event.pull_request.number }}-${GITHUB_SHA:0:12}-arm64" \
            .
